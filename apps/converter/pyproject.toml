[project]
name = "khmer-pdf-converter"
version = "1.0.0"
description = "Khmer-aware PDF to DOCX / PPTX / XLSX / CSV / TXT / image converter service"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "PyMuPDF==1.26.7",
    "pdf2docx==0.5.13",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "pytesseract==0.3.13",
    "Pillow==11.2.1",
    "fonttools==4.57.0",
    "docxcompose==1.4.0",
    # docxcompose still imports pkg_resources, removed in setuptools 81
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pyflakes==3.2.0",
]

[tool.uv]
# the app is run from its folder (uvicorn app.main:app); it is not installed as a package
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
