user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format gateway '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'upstream: $upstream_addr upstream_status: $upstream_status '
                       'response_time: $upstream_response_time request_time: $request_time';
    access_log  /var/log/nginx/access.log  gateway;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # PDF uploads: keep a little above MAX_FILE_MB in .env (the API enforces the real limit)
    client_max_body_size 110M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Real visitor address. Requests arriving from this server or a Docker network (Cloudflare Tunnel,
    # a host nginx / Caddy with TLS) carry the visitor in X-Forwarded-For; anyone else is the visitor.
    # The API counts free guest conversions per address, so this must be right.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # keep https when a tunnel / proxy in front terminated TLS
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    include /etc/nginx/conf.d/*.conf;
}
